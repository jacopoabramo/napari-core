name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and import contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyrefly check
      - run: uv run pyright
      - run: uv run lint-imports

  tests:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Only Linux is known to have a renderer for both backends on these
    # runners, so the other two report without failing the run.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    env:
      # On Windows wgpu prefers the Mesa OpenGL adapter that the display action
      # installs for vispy, and pygfx under Qt does not present frames on wgpu's
      # OpenGL backend. Direct3D 12 works.
      WGPU_BACKEND_TYPE: ${{ matrix.os == 'windows-latest' && 'D3D12' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Start a display and install what Qt and OpenGL need
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
          pyvista: false
      - name: Install the software Vulkan driver that wgpu uses
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev
      - run: uv sync --locked
      - name: Say which GPU adapter wgpu finds
        run: uv run python -c "import wgpu; print(wgpu.gpu.request_adapter_sync().info)"
      - run: uv run pytest -q

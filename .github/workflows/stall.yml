name: Repeat the pygfx render tests

# The pygfx render tests sometimes time out waiting for an event. This runs
# them many times on each system and keeps the output, to see how often.

on:
  # A workflow started by hand must be on the default branch, so on a working
  # branch a change to the trigger file starts it.
  push:
    paths:
      - .github/stall-trigger
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run the tests
        default: "20"
      select:
        description: The pytest -k expression
        default: pygfx

permissions:
  contents: read

jobs:
  repeat:
    name: Repeated runs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # pygfx under Qt does not present frames on wgpu's OpenGL backend, which
      # wgpu prefers on the Windows runner. Direct3D 12 works.
      WGPU_BACKEND_TYPE: ${{ matrix.os == 'windows-latest' && 'D3D12' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Start a display and install what Qt and OpenGL need
        uses: pyvista/setup-headless-display-action@v5
        with:
          qt: true
          pyvista: false
      - name: Install the software Vulkan driver that wgpu uses
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev
      - run: uv sync --locked
      - name: Say which GPU adapter wgpu finds
        run: uv run python -c "import wgpu; print(wgpu.gpu.request_adapter_sync().info)"
      - name: Run the tests repeatedly
        shell: bash
        env:
          RUNS: ${{ inputs.runs || '20' }}
          SELECT: ${{ inputs.select || 'pygfx' }}
        run: |
          mkdir -p stall
          failed=0
          for i in $(seq 1 "$RUNS"); do
            if uv run pytest tests/render -k "$SELECT" -q -p no:cacheprovider > "stall/run-$i.txt" 2>&1; then
              echo "run $i: passed"
            else
              failed=$((failed + 1))
              echo "run $i: FAILED"
              grep -E "^(FAILED|ERROR)|timed out" "stall/run-$i.txt" || tail -5 "stall/run-$i.txt"
            fi
          done
          echo "$failed of $RUNS runs failed" | tee stall/summary.txt
          echo "### $failed of $RUNS runs failed on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stall-${{ matrix.os }}
          path: stall
